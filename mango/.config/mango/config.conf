# More option see https://github.com/DreamMaoMao/mango/wiki/
exec-once=qs -c noctalia-shell &

exec-once=gsettings set org.gnome.desktop.interface cursor-theme BreezeX-RosePine-Linux
exec-once=gsettings set org.gnome.desktop.interface cursor-size 28
env=HYPRCURSOR_SIZE,28

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 1
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0

border_radius=5
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=0
animation_duration_focus=1
# animation_duration_move=0
# animation_duration_open=0
# animation_duration_tag=0
# animation_duration_close=0
# animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=40
repeat_delay=300
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=1

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:monocle
tagrule=id:2,layout_name:monocle
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=ALT,r,reload_config

# menu and terminal
bind=Alt,space,spawn, qs -c noctalia-shell ipc call launcher toggle
bind=ALT,W,spawn,qs -c noctalia-shell ipc call wallpaper toggle
bind=ALT,C,spawn,qs -c noctalia-shell ipc call controlCenter toggle
bind=ALT,S,spawn,qs -c noctalia-shell ipc call settings toggle
bind=ALT+SHIFT,B,spawn,qs -c noctalia-shell ipc call bar toggle
bind=ALT+SHIFT,Q,spawn,qs -c noctalia-shell ipc call sessionMenu toggle
bind=SUPER,C,spawn,swaync-client -t
bind=SUPER,P,spawn,shotwell
bind=SUPER,D,spawn,emacs
bind=SUPER+SHIFT,L,spawn,hyprlock
bind=ALT,D,spawn,dolphin
bind=Alt,T,spawn,kitty
bind=ALT,Return,spawn,foot
bind=ALT,B,spawn,brave
bind=SUPER,O,spawn,obsidian
bind=SUPER,S,exec,sh -c "grim -g "$(slurp)" - | wl-copy"
bind = SUPER,S,spawn, sh -c 'grim -g "$(slurp)" /tmp/shot.png && wl-copy < /tmp/shot.png'

# exit
bind=ALT,m,quit
bind=ALT,q,killclient,

# switch window focus
bind=ALT,Tab,focusstack,next
bind=ALT,H,focusdir,left
bind=ALT,L,focusdir,right
bind=ALT,K,focusdir,up
bind=ALT,J,focusdir,down

# swap window
bind=ALT+SHIFT,K,exchange_client,up
bind=ALT+SHIFT,J,exchange_client,down
bind=ALT+SHIFT,H,exchange_client,left
bind=ALT+SHIFT,L,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal
bind=ALT,O,toggleoverview
bind=ALT,V,togglefloating
bind=ALT,a,togglemaximizescreen
bind=ALT,f,togglefullscreen
bind=ALT+SHIFT,f,togglefakefullscreen
bind=SUPER,i,minimized
# bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,H,viewtoleft,0
bind=CTRL,H,viewtoleft_have_client,0
bind=SUPER,L,viewtoright,0
bind=CTRL,L,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=ALT,1,view,1,0
bind=ALT,2,view,2,0
bind=ALT,3,view,3,0
bind=ALT,4,view,4,0
bind=ALT,5,view,5,0
bind=ALT,6,view,6,0
bind=ALT,7,view,7,0
bind=ALT,8,view,8,0
bind=ALT,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER,1,tag,1,0
bind=SUPER,2,tag,2,0
bind=SUPER,3,tag,3,0
bind=SUPER,4,tag,4,0
bind=SUPER,5,tag,5,0
bind=SUPER,6,tag,6,0
bind=SUPER,7,tag,7,0
bind=SUPER,8,tag,8,0
bind=SUPER,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,K,movewin,+0,-50
bind=CTRL+SHIFT,J,movewin,+0,+50
bind=CTRL+SHIFT,H,movewin,-50,+0
bind=CTRL+SHIFT,L,movewin,+50,+0

# resizewin
bind=CTRL+ALT,K,resizewin,+0,-50
bind=CTRL+ALT,J,resizewin,+0,+50
bind=CTRL+ALT,H,resizewin,-50,+0
bind=CTRL+ALT,L,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# This sources the noctalia theme

source = /home/asrwx/.config/mango/noctalia.conf

