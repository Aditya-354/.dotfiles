bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g message-limit 1

set -s escape-time 0
set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold] #S #[fg=${gray_light},nobold]│ "
set -g status-right "#H  "
set -g window-status-current-format "#[fg=${cyan_soft},bold]#[nounderscore]  #I:#W"
set -g window-status-format "   #I:#W"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${gray_medium}"

