bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",tmux-256color:Tc,xterm-kitty:Tc"
set -s escape-time 0
set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

bg="#151520"
fg="#55ccda"

# set -g status-left-length 100
# set -g status-style "fg=${fg},bg=${bg}"
set -g status-right "\"#H\" "
# set -g status-right ""
set -g status-style bg=default
set -g status-style fg=default
set -g status-position top
set-window-option -g window-status-style "fg=default,bg=default,nounderscore"
set-window-option -g window-status-current-style "fg=cyan,bg=default,bold,nounderscore"
